groups:
  - name: booking-sla
    rules:
      - alert: ServiceDown
        expr: up{job="web"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Сервис бронирования недоступен"
          description: "Prometheus не может получить метрики приложения более 1 минуты."

      - alert: AvailabilityBelowSLA
        expr: |
          sum(rate(django_http_responses_total_by_status_total{status!~"5.."}[5m]))
          / sum(rate(django_http_responses_total_by_status_total[5m])) < 0.999
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Доступность ниже SLA 99.9%"
          description: "Доля успешных (не 5xx) ответов за 5 минут ниже 99.9%."

      - alert: HighErrorRate
        expr: |
          sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
          / sum(rate(django_http_responses_total_by_status_total[5m])) > 0.001
          and sum(rate(django_http_responses_total_by_status_total[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Доля ошибок 5xx выше 0.1%"
          description: "Рост числа серверных ошибок, проверьте логи приложения и состояние БД."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(
            django_http_requests_latency_seconds_by_view_method_bucket{view!~"prometheus-django-metrics|health"}[5m]
          ))) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 времени ответа выше 200 мс"
          description: "95-й перцентиль времени ответа превышает порог SLA в течение 5 минут."

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "База данных недоступна"
          description: "Экспортёр PostgreSQL не может подключиться к БД."

      - alert: DatabaseConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Использовано более 80% соединений с БД"
          description: "Пул соединений PostgreSQL близок к исчерпанию."
